[project]
name = "acs-fsm-backend"
version = "0.1.0"
description = "FastAPI backend foundation for the Apple Cleaning Systems FSM platform."
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.17,<2.0",
    "fastapi[standard]>=0.128,<1.0",
    "psycopg[binary]>=3.3,<4.0",
    "pydantic-settings>=2.12,<3.0",
    "sqlalchemy>=2.0,<3.0",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.28,<1.0",
    "pytest>=9.0,<10.0",
    "ruff>=0.14,<1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

