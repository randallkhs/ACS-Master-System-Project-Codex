# ==============================
# Codex MCP Pack - Disabled by Default
# ==============================
# Copy any server block into ~/.codex/config.toml or project .codex/config.toml
# Change enabled = false to enabled = true only when needed.

[mcp_servers.context7]
command = "npx"
args = ["-y", "@upstash/context7-mcp"]
enabled = false

[mcp_servers.playwright]
command = "npx"
args = ["-y", "@playwright/mcp@latest"]
enabled = false

[mcp_servers.filesystem]
command = "npx"
args = ["-y", "@modelcontextprotocol/server-filesystem", "/Users/randyr"]
enabled = false

[mcp_servers.sequential-thinking]
command = "npx"
args = ["-y", "@modelcontextprotocol/server-sequential-thinking"]
enabled = false

[mcp_servers.memory]
command = "npx"
args = ["-y", "@modelcontextprotocol/server-memory"]
enabled = false

[mcp_servers.firecrawl]
command = "npx"
args = ["-y", "firecrawl-mcp"]
enabled = false

[mcp_servers.puppeteer]
command = "npx"
args = ["-y", "@modelcontextprotocol/server-puppeteer"]
enabled = false

[mcp_servers.postgres]
command = "npx"
args = ["-y", "@modelcontextprotocol/server-postgres"]
enabled = false

[mcp_servers.supabase]
command = "npx"
args = ["-y", "@supabase/mcp-server-supabase"]
enabled = false

[mcp_servers.vercel]
command = "npx"
args = ["-y", "vercel-mcp"]
enabled = false

[mcp_servers.chrome-devtools]
command = "npx"
args = ["-y", "chrome-devtools-mcp"]
enabled = false
